<meta name="theme-color" content="#0E1511">

<meta name="description" content="Language Tracking Model: study hours, levels, words and projects.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<style>
/* Layout: game character sheet. Sticky top bar + tab row; panels in wrapping rows; one column on phones. Dark only, three palettes. */
:root,[data-pal="forest"]{
  --bg:#0E1511; --glow:rgba(92,160,98,.16); --pan:#16211A; --pan2:#1E2C23; --edge:#2E4235; --well:#0A100C;
  --txt:#E7EFE7; --dim:#A3B5A7; --gold:#E9B949; --gold2:#F7D57E;
  --a1:#6CCB7A; --a2:#5BB4E6; --a3:#E9876B; --good:#7DDB8A; --warn:#F0B24E; --bad:#F07F7F;
  color-scheme:dark}
[data-pal="slate"]{
  --bg:#0D131A; --glow:rgba(91,140,214,.16); --pan:#141D27; --pan2:#1B2633; --edge:#2B3B4D; --well:#090E14;
  --txt:#E6ECF3; --dim:#9AAABD; --gold:#F2B544; --gold2:#FFD584;
  --a1:#5FB0F2; --a2:#6CD3B6; --a3:#F28A6B; --good:#76D7A0; --warn:#F2B544; --bad:#F28585}
[data-pal="ember"]{
  --bg:#141110; --glow:rgba(232,128,62,.14); --pan:#1D1916; --pan2:#27211D; --edge:#3D342D; --well:#0E0B0A;
  --txt:#F2EBE5; --dim:#B6A99C; --gold:#F0A23B; --gold2:#FFC77A;
  --a1:#F0A23B; --a2:#7FC7B8; --a3:#E3735E; --good:#93D59A; --warn:#F0A23B; --bad:#EE8577}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--txt);background:var(--bg);font:15px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  background-image:radial-gradient(circle at 8% 0%,var(--glow),transparent 42%);background-repeat:no-repeat;min-height:100vh}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--edge)}
.top .bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.ibtn{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid var(--edge);background:var(--pan);color:var(--txt);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:hover{border-color:var(--gold)}
.brand{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0}
.brand .t{font-family:"Silkscreen",monospace;font-size:17px;line-height:1.1}
.brand .s{font-size:12.5px;color:var(--dim)}
.syncpill{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--pan);font-size:13px;font-weight:700;cursor:pointer;color:var(--txt)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.btn{min-height:42px;padding:0 16px;border-radius:10px;border:2px solid var(--gold);background:var(--gold);color:var(--well);font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.quiet{background:var(--pan2);border-color:var(--edge);color:var(--txt)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-width:1.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:none;display:flex;align-items:center;min-height:42px;padding:0 13px;color:var(--dim);text-decoration:none;font-weight:800;font-size:14px;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--txt)}
.tabs a[aria-current="page"]{color:var(--gold);border-bottom-color:var(--gold)}

main{padding-block:20px 56px}
.view{display:flex;flex-direction:column;gap:18px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vh h1{font-family:"Silkscreen",monospace;font-weight:400;font-size:24px;margin:0;line-height:1.15}
.vh p{margin:4px 0 0;color:var(--dim);max-width:72ch}
.row{display:flex;flex-wrap:wrap;gap:18px}
.row>*{min-width:0}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.pan{background:var(--pan);border:2px solid var(--edge);border-radius:14px;padding:18px;min-width:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h2{font-family:"Silkscreen",monospace;font-weight:400;font-size:15px;letter-spacing:.02em;margin:0;color:var(--gold)}
h3{font-size:16px;margin:0}
.sub{font-size:13px;color:var(--dim)}
.muted{color:var(--dim)}
.grow{flex:999 1 520px}.side{flex:1 1 340px}.half{flex:1 1 440px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:800;font-size:12.5px;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.mute{background:var(--pan2);color:var(--dim)}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--bad) 13%,var(--pan));border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);font-weight:700}
.alert.note{background:color-mix(in srgb,var(--a2) 12%,var(--pan));border-color:color-mix(in srgb,var(--a2) 45%,transparent)}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--pan2)}
.seg button{min-height:34px;padding:0 12px;border:0;background:transparent;font-size:13px;font-weight:800;color:var(--dim);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--well)}
select.sel,input.inp,textarea.inp{min-height:38px;border-radius:9px;border:1px solid var(--edge);background:var(--well);padding:0 10px;font-size:14px;color:var(--txt)}
textarea.inp{padding:10px;min-height:160px;width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.45}
input.inp.n{width:96px;text-align:right}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--edge);border-radius:12px}
svg{display:block}
.chart svg{overflow:visible}
.ax{fill:var(--dim);font-family:"Nunito",sans-serif;font-size:11px;font-weight:700}
.vl{fill:var(--txt);font-family:"Nunito",sans-serif;font-size:12.5px;font-weight:800}
.gl{stroke:var(--edge);stroke-width:1}
.hov{fill:transparent}.hov:hover{fill:color-mix(in srgb,var(--txt) 6%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--dim);font-weight:700;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.sw.ln{height:3px;width:16px;border-radius:2px}

/* hero */
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ava{width:92px;height:92px;border-radius:16px;background:var(--pan2);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.name{font-family:"Silkscreen",monospace;font-size:26px;line-height:1.1}
.lvl{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:4px;font-weight:700;color:var(--dim)}
.lvl b{font-family:"Silkscreen",monospace;font-weight:400;color:var(--gold);font-size:18px}
.meter{height:16px;border-radius:8px;background:var(--well);border:2px solid var(--edge);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;flex:1 1 460px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--pan2);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-family:"Silkscreen",monospace;font-weight:400;font-size:23px;line-height:1.2}
.stat small{display:block;font-weight:800;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--dim);margin-top:2px}

/* language rows */
.lrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--edge)}
.lrow:last-child{border-bottom:0}
.flag{width:40px;height:28px;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.18);display:inline-flex;flex:none;vertical-align:middle}
.flag.sm{width:28px;height:20px;border-radius:4px}
.lrow .nm{font-weight:800;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lrow .nm span{font-weight:700;color:var(--dim);font-size:13px}
.trk{height:9px;border-radius:5px;background:var(--well);position:relative;overflow:hidden;margin-top:5px}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.trk u{position:absolute;top:0;bottom:0;width:2px;background:var(--txt);opacity:.6}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:center;margin-top:4px;font-size:12px;color:var(--dim);font-weight:700}
.bars .trk{margin-top:0}
.badge{font-family:"Silkscreen",monospace;font-size:15px;color:var(--gold);text-align:right;white-space:nowrap}
.badge small{display:block;font:700 11px "Nunito",sans-serif;color:var(--dim)}
.info{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--dim);background:transparent;color:var(--dim);font:800 12px/1 "Nunito",sans-serif;display:inline-flex;align-items:center;justify-content:center;cursor:help;padding:0;vertical-align:middle}
.info:hover{border-color:var(--gold);color:var(--gold)}

/* tables */
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;font-weight:800;color:var(--dim);text-align:left;padding:8px 6px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
td{padding:8px 6px;border-top:1px solid var(--edge);font-size:14px;vertical-align:middle}
td.r,th.r{text-align:right}
tfoot td{font-weight:800}

/* objectives */
.obj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:5px 0}
.obj .trk{grid-column:1/-1;margin-top:0}
.obj b{font-family:"Silkscreen",monospace;font-weight:400;font-size:12.5px;color:var(--gold)}
.rule{margin-top:12px;padding:12px;border-radius:10px;background:var(--pan2);font-size:13.5px}

/* milestones */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ach{background:var(--pan2);border-radius:12px;padding:12px 8px;text-align:center;font-weight:800;font-size:12.5px;line-height:1.25}
.ach svg{margin:0 auto 6px}
.ach .when{display:block;font-weight:700;font-size:11px;color:var(--dim);margin-top:3px}
.ach.lock{opacity:.5}.ach.lock svg{filter:grayscale(1)}

/* list mgmt */
.mgmt{display:grid;grid-template-columns:auto 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--edge)}
.mgmt:first-child{border-top:0}
.mgmt.off{opacity:.55}
.updown{display:flex;flex-direction:column;gap:2px}
.updown button{width:32px;height:22px;border-radius:6px;border:1px solid var(--edge);background:var(--pan2);color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.updown button[disabled]{opacity:.3;cursor:default}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--pan2);font-size:13px;font-weight:800;cursor:pointer;color:var(--dim);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--well)}
details.pan>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.pan>summary::-webkit-details-marker{display:none}
details.pan>summary::after{content:"+";font:800 18px "Nunito";color:var(--dim)}
details.pan[open]>summary::after{content:"–"}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--dim);font-weight:800}
.fld input,.fld select,.fld textarea{min-height:40px;border-radius:9px;border:1px solid var(--edge);background:var(--well);padding:0 10px;font-size:14.5px;color:var(--txt);font-weight:600}
.fld textarea{padding:8px 10px;min-height:70px}
.fld.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--txt)}
.fld.chk input{min-height:0;width:18px;height:18px;accent-color:var(--gold)}

/* drawer/modal/tip/toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(340px,88vw);z-index:61;background:var(--pan);border-left:2px solid var(--edge);display:flex;flex-direction:column;gap:6px;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 16px;transform:translateX(102%);transition:transform .2s ease}
.drawer.open{transform:none}
.drawer nav{display:flex;flex-direction:column;gap:2px}
.drawer nav a,.drawer nav button{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:10px;color:var(--txt);text-decoration:none;font-weight:800;border:0;background:transparent;cursor:pointer;text-align:left;font-size:15px;width:100%}
.drawer nav a:hover,.drawer nav button:hover{background:var(--pan2)}
.drawer nav a[aria-current="page"]{background:var(--pan2);color:var(--gold)}
.drawer hr{border:0;border-top:1px solid var(--edge);margin:8px 4px}
.dl{font-family:"Silkscreen",monospace;font-size:12px;color:var(--dim);padding:4px 12px}
.pals{display:flex;flex-direction:column;gap:6px;padding:0 6px}
.pals button{min-height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--edge);background:var(--pan2);color:var(--txt);font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.pals button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pals i{width:20px;height:20px;border-radius:50%;display:inline-block}
.modal{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow-y:auto;background:var(--pan);border:2px solid var(--edge);border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.mh h2{font-size:17px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.drop{border:2px dashed var(--edge);border-radius:12px;padding:20px;text-align:center;color:var(--dim);background:var(--well);display:block;cursor:pointer}
.drop.over{border-color:var(--gold)}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.step .n{width:30px;height:30px;border-radius:8px;background:var(--pan2);color:var(--gold);font-family:"Silkscreen",monospace;display:flex;align-items:center;justify-content:center}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--txt);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12.5px;font-weight:700;line-height:1.4;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#toast{position:fixed;z-index:95;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--well);font-weight:800;padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px)}
.vers{display:flex;flex-direction:column;gap:16px}
.ver{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;padding-top:16px;border-top:1px dashed var(--edge)}
.ver:first-child{border-top:0;padding-top:0}
.ver .tag{font-family:"Silkscreen",monospace;color:var(--gold);font-size:17px}
.ver ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--dim);font-size:14px;max-width:76ch}
.ver .grp{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt);margin-top:10px}
.prose{max-width:72ch;color:var(--dim)}
.prose h3{color:var(--txt);margin-top:16px}
@media (max-width:640px){.ver{grid-template-columns:1fr;gap:4px}.vh h1{font-size:20px}.brand .t{font-size:15px}.mgmt{grid-template-columns:auto 34px minmax(0,1fr)}.mgmt .tools{grid-column:1/-1;justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
/* compact dashboard tiles */
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;grid-auto-flow:row dense;align-items:start}
.tile{background:var(--pan);border:2px solid var(--edge);border-radius:12px;padding:12px 14px;min-width:0;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);position:relative}
.t-xs{grid-column:span 2}.t-s{grid-column:span 3}.t-m{grid-column:span 4}.t-l{grid-column:span 6}.t-w{grid-column:span 8}.t-xl{grid-column:span 12}
@media (max-width:1100px){.dgrid{grid-template-columns:repeat(6,minmax(0,1fr))}.t-xs{grid-column:span 2}.t-s,.t-m{grid-column:span 3}.t-l,.t-w,.t-xl{grid-column:span 6}}
@media (max-width:640px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.t-xs,.t-s{grid-column:span 1}.t-m,.t-l,.t-w,.t-xl{grid-column:span 2}}
.th{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.th h2{font-size:13px}
.tile .lrow{grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:6px 0}
.tile .lrow .flag{width:30px;height:21px}
.tile .lrow .nm{font-size:14px}.tile .lrow .nm span{font-size:12px}
.tile .bars{font-size:11px}.tile .trk{height:7px}
.tile .badge{font-size:13px}
.tile .obj{padding:3px 0;font-size:13.5px;grid-template-columns:auto minmax(0,1fr) auto}
.tile .obj .trk{grid-column:1/-1}
.tile .obj b{font-size:11.5px}
.tile .rule{margin-top:8px;padding:8px 10px;font-size:12.5px}
.tile .sub{font-size:12px}
.tile .badges{grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.tile .ach{padding:8px 4px;font-size:11px;border-radius:9px}
.tile .ach svg{margin:0 auto 4px}
.tile .legend{font-size:11.5px;gap:4px 10px;margin-top:4px}
.tile.t-proj h2{font-size:13px}
.tile.t-proj .ph{margin-bottom:6px}
.kpi{text-align:center;padding:4px 0}
.kpi b{display:block;font-family:"Silkscreen",monospace;font-weight:400;font-size:22px;line-height:1.15}
.kpi small{display:block;font-weight:800;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.kinfo{position:absolute;top:8px;right:8px;width:20px;height:20px;font-size:11px}
.lvlbox{display:flex;gap:12px;align-items:center}
.ava.sm{width:54px;height:54px;border-radius:12px;border-width:2px}
.lvlbox .name{font-size:18px}.lvlbox .lvl b{font-size:15px}.lvlbox .lvl{font-size:12.5px;margin-top:2px}.lvlbox .meter{height:12px;margin-top:6px}
.btn.xs{min-height:30px;padding:0 10px;font-size:12px;border-width:1.5px;border-radius:8px}
select.sel.xs{min-height:30px;font-size:12px;padding:0 6px;border-radius:7px}
.flag.xs{width:22px;height:15px;border-radius:3px}
.alert.slim{padding:8px 12px;font-size:13.5px}
.tedit{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px -4px 8px;padding:6px;border-radius:8px;background:var(--pan2);border:1px dashed var(--gold)}
.tedit .tname{flex:1;min-width:0;font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grip{width:30px;height:30px;border-radius:7px;border:1px solid var(--edge);background:var(--pan);color:var(--txt);cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0}
.grip:active{cursor:grabbing}
.tbtn{width:28px;height:30px;border-radius:7px;border:1px solid var(--edge);background:var(--pan);color:var(--txt);font-weight:800;cursor:pointer;padding:0}
.tbtn[disabled]{opacity:.35;cursor:default}
.dgrid.editing .kinfo{display:none}
.t-xs .tedit .tname,.t-s .tedit .tname{display:none}
.tile.dragging{opacity:.55;outline:2px dashed var(--gold);outline-offset:2px}
.dgrid.editing .tile{user-select:none}
.meter i.busy{animation:busy 1.1s ease-in-out infinite alternate}
@keyframes busy{from{margin-left:0}to{margin-left:65%}}
@media (prefers-reduced-motion:reduce){.meter i.busy{animation:none}}

html{overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}

.tile.dz-l::after,.tile.dz-r::after,.tile.dz-t::after,.tile.dz-b::after{content:"";position:absolute;background:var(--gold);border-radius:3px;pointer-events:none;z-index:2}
.tile.dz-l::after{left:-9px;top:0;bottom:0;width:5px}.tile.dz-r::after{right:-9px;top:0;bottom:0;width:5px}
.tile.dz-t::after{top:-9px;left:0;right:0;height:5px}.tile.dz-b::after{bottom:-9px;left:0;right:0;height:5px}
.grip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.dgrid.editing{-webkit-touch-callout:none}
.dgrid.editing .tile *{-webkit-user-select:none;user-select:none}

}

function bindDrag() {
  const grid = q("#dgrid"); if (!grid) return;
  let drag = null, target = null;
  const clear = () => grid.querySelectorAll(".dz-l,.dz-r,.dz-t,.dz-b").forEach(t => t.classList.remove("dz-l", "dz-r", "dz-t", "dz-b"));
  grid.addEventListener("pointerdown", e => {
    const h = e.target.closest(".grip"); if (!h) return;
    e.preventDefault(); const tile = h.closest(".tile");
    drag = { tile, y: e.clientY, timer: setInterval(() => { if (!drag) return; if (drag.y < 90) scrollBy(0, -14); else if (drag.y > innerHeight - 120) scrollBy(0, 14); }, 16) };
    target = null; tile.classList.add("dragging");
    try { h.setPointerCapture(e.pointerId); } catch (err) {}
  });
  grid.addEventListener("pointermove", e => {
    if (!drag) return;
    drag.y = e.clientY; clear(); target = null;
    const over = document.elementsFromPoint(e.clientX, e.clientY).map(el => el.closest && el.closest(".tile")).find(t => t && t !== drag.tile && grid.contains(t));
    if (!over) return;
    const r = over.getBoundingClientRect(), wide = r.width > grid.clientWidth * 0.7;
    const before = wide ? e.clientY < r.top + r.height / 2 : e.clientX < r.left + r.width / 2;
    target = { id: over.dataset.tile, before };
    over.classList.add(wide ? (before ? "dz-t" : "dz-b") : (before ? "dz-l" : "dz-r"));
  });
  const end = ev => {
    if (!drag) return;
    clearInterval(drag.timer); clear(); drag.tile.classList.remove("dragging");
    const id = drag.tile.dataset.tile, t = target; drag = null; target = null;
    if (ev && ev.type === "pointercancel" || !t) return;
    const order = [...grid.querySelectorAll(".tile")].map(x => x.dataset.tile).filter(x => x !== id);
    let i = order.indexOf(t.id); if (i < 0) return; if (!t.before) i++;
    order.splice(i, 0, id);
    const on = order.map(x => S.prefs.dash.find(d => d.id === x)).filter(Boolean);
    S.prefs.dash = on.concat(S.prefs.dash.filter(d => !order.includes(d.id)));
    commit();
  };
  grid.addEventListener("pointerup", end); grid.addEventListener("pointercancel", end);
}

function vAbout() {
  return `<div class="vh"><div><h1>About this app</h1></div></div>
  <section class="pan"><div class="prose">
    <p>The Oakey Language Tracking Model is Mackay Oakey's record of language study: every session timed in Toggl Track since April 1, 2022, estimates of the years before, word counts, levels and projects. It runs in your browser with no server of its own. Install it from its web address on your iPhone or computer, and Device sync keeps the copies in step.</p>
    <h3>Where your changes live</h3>
    <p>Edits are saved in this browser, on this device. With Device sync on (Settings), they are also saved to a private GitHub repository and loaded on your other devices. Without it, another browser or device starts from the built-in data, so use Settings → Copy State to back up or move your work, and Upload State to bring it in.</p>
    <h3>Levels</h3>
    <p>Your level is 1 per ${f0(S.prefs.hoursPerLevel)} lifetime hours. For each language, the badge is your own self-assessment. The hours bar uses the U.S. Foreign Service Institute's estimate of class hours to professional working proficiency (treated as C1, or N1 for Japanese), with the other rungs scaled from Cambridge's guided-learning hours. The words bar uses your editable word ladder. FSI hours are intensive classroom hours, so self-study hours don't compare one-to-one; treat both bars as yardsticks.</p>
    <h3>Biblical languages</h3>
    <p>Biblical Hebrew and Biblical Greek use a reading-only version of the A1–C2 labels, earned by headwords known at Anki's mature level. Corpus sizes: Hebrew Bible about 9,375 headwords; Greek New Testament about 5,390; Septuagint about 13,850; both together about 15,290.</p>
    <h3>How Sync works</h3>
    <p>Toggl doesn't let web pages call its API, so Sync now asks a small go-between: the helper on your computer, or your Google Apps Script (the only option on an iPhone). If neither is set up, you can import a Toggl CSV instead. Duplicates and excluded projects are skipped.</p>
    <h3>How hours are calculated</h3>
    <ul><li>2022 full year = tracked hours × 4/3 (tracking began April 1).</li><li>This year's projection = hours so far ÷ share of the year elapsed.</li><li>Streaks count consecutive days with any study (or your minimum), by local date.</li><li>Project pace = average completion of the goals vs share of the window elapsed.</li></ul>
    <p class="sub">Version ${APP.version} · State schema ${APP.schema} · Toggl workspace ${S.toggl.workspace}</p>
  </div></section>`;
}

    if (c.sha && ghDirty()) {                                // usual case: we have edits and the cloud hasn't moved
      const at = S.savedAt, text = ghText();
      try { c.sha = await ghPut(c, text, c.sha); c.syncedAt = at; ghSave(); ghSet("ok", "Synced " + ghClock()); done = true; }
      catch (e) { if (!e.conflict) throw e; }               // cloud moved: fall through and compare
    }
    if (!done) await ghReconcile(c);
  } catch (e) { ghFail(e); }
  finally { GH.busy = false; GH.last = Date.now(); if (GH.again) { GH.again = false; ghSchedule(1500); } }
}
async function ghReconcile(c) {
  const rem = await ghGetRemote(c);
  if (!rem) { const at = S.savedAt; c.sha = await ghPut(c, ghText(), null, "LTM State (first upload)"); c.syncedAt = at; ghSave(); ghSet("ok", "Synced " + ghClock()); return; }
  let remote;
  try { remote = migrate(JSON.parse(rem.text)); } catch (e) { throw new Error("The file on GitHub isn't a readable LTM State (" + e.message + "). Nothing was changed."); }
  if (rem.sha === c.sha) {
    if (ghDirty()) { const at = S.savedAt; c.sha = await ghPut(c, ghText(), rem.sha); c.syncedAt = at; ghSave(); ghSet("ok", "Synced " + ghClock()); }
    else ghSet("ok", "Up to date " + ghClock());
    return;
  }
  if (remote.savedAt && remote.savedAt === S.savedAt) { c.sha = rem.sha; c.syncedAt = S.savedAt; ghSave(); ghSet("ok", "Up to date " + ghClock()); return; }
  if (!ghDirty()) { ghAdopt(c, remote, rem.sha, "Loaded newer data from GitHub."); return; }
  GH.conflict = { remote, sha: rem.sha }; ghSet("conflict", "Needs your choice"); ghConflictModal();
}
function ghAdopt(c, remote, sha, msg) {
  try { localStorage.setItem(UNDO_KEY, JSON.stringify(S)); } catch (e) {}
  S = remote; if (!S.savedAt) S.savedAt = new Date().toISOString(); firstRun = false;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; }
  c.sha = sha; c.syncedAt = S.savedAt; ghSave();
  compute(); render(); ghSet("ok", "Synced " + ghClock()); toast(msg);
}
function ghConflictModal() {
  const cf = GH.conflict; if (!cf) return;
  const when = iso => iso ? new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "unknown";
  const first = !GH.cfg.syncedAt;
  const box = (t, st) => `<div class="rule" style="flex:1 1 230px;margin:0"><b>${t}</b><div class="sub">Saved ${when(st.savedAt)}</div><ul style="margin:6px 0 0;padding-left:18px">${summarize(st).map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>`;
  openModal(first ? "GitHub already has your data" : "Two versions of your data",
    `<p style="margin-top:0">${first ? "A saved copy already exists on GitHub. Choose which one this device should use." : "This device and GitHub both changed since they last matched. Choose which copy to keep."} The copy you don't pick is not lost: this device keeps an Undo, and GitHub keeps the file's earlier versions.</p>
     <div class="row" style="gap:10px">${box("This device", S)}${box("On GitHub", cf.remote)}</div>
     <div class="actions"><button class="btn quiet" id="ghUseCloud">Use GitHub's copy</button><button class="btn" id="ghUseLocal">Keep this device's copy</button></div>`,
    b => { b.querySelector("#ghUseCloud").onclick = () => ghResolve("cloud"); b.querySelector("#ghUseLocal").onclick = () => ghResolve("local"); });
}
async function ghResolve(keep) {
  const cf = GH.conflict, c = GH.cfg; if (!cf || !c) return;
  closeModal();
  if (keep === "cloud") { GH.conflict = null; ghAdopt(c, cf.remote, cf.sha, "Loaded GitHub's copy. Undo is in Settings."); return; }
  GH.busy = true; ghSet("syncing", "Uploading…");
  let retry = false;
  try { const at = S.savedAt; c.sha = await ghPut(c, ghText(), cf.sha, "LTM State (kept this device's copy)"); c.syncedAt = at; ghSave(); GH.conflict = null; ghSet("ok", "Synced " + ghClock()); toast("GitHub now has this device's copy."); }
  catch (e) { if (e.conflict) { GH.conflict = null; retry = true; } else ghFail(e); }
  finally { GH.busy = false; }
  if (retry) ghSync("retry");
}
async function ghConnect(f) {
  const c = { owner: f.owner, repo: f.repo, path: (f.path || "ltm/state.json").replace(/^\/+/, ""), branch: f.branch || "main", token: f.token, sha: null, syncedAt: null };
  GH.cfg = c; GH.conflict = null; ghSave(); render();
  await ghSync("connect");
  if (GH.st.s === "ok") toast("Connected. This device and GitHub match.");
}
function ghFields() {
  const v = id => (q("#" + id) ? q("#" + id).value.trim() : "");
  return { owner: v("ghOwner"), repo: v("ghRepo"), path: v("ghPath"), branch: v("ghBranch"), token: v("ghToken") || (GH.cfg ? GH.cfg.token : "") };
}
function copyText(text, msg) {
  const done = () => toast(msg);
  const fallback = () => { const t = document.createElement("textarea"); t.value = text; t.style.cssText = "position:fixed;opacity:0;top:0"; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (e) {} t.remove(); done(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
function vDevSync() {
  const c = GH.cfg, on = !!c;
  return `<section class="pan" id="devsync"><div class="ph"><h2>Device sync (GitHub)</h2><span class="sub" id="ghStatus">${esc(ghLine())}</span></div>
    <p class="sub" style="margin:0 0 12px">Keeps your data the same on your iPhone and your computer. Your State is saved as one file in a private GitHub repository that you own. The token stays in this browser and is never part of State. (The Apps Script key below also stays per device.)</p>
    <div class="grid2">
      <label class="fld">GitHub username<input id="ghOwner" value="${esc(c ? c.owner : "")}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="mackayoakey"></label>
      <label class="fld">Private data repository<input id="ghRepo" value="${esc(c ? c.repo : "")}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="ltm-data"></label>
      <label class="fld">File path<input id="ghPath" value="${esc(c ? c.path : "ltm/state.json")}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></label>
      <label class="fld">Branch<input id="ghBranch" value="${esc(c ? c.branch : "main")}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></label>
      <label class="fld">Access token<input id="ghToken" type="password" value="${esc(c ? c.token : "")}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="github_pat_…"></label>
    </div>
    <div class="actions" style="justify-content:flex-start">
      ${on ? `<button class="btn" data-act="ghsync">Sync now</button><button class="btn quiet" data-act="ghconnect">Save changes</button><button class="btn quiet" data-act="ghcode">Copy setup code</button>${GH.conflict ? `<button class="btn" data-act="ghresolve">Choose a copy</button>` : ""}<button class="btn danger" data-act="ghoff">Disconnect</button>` : `<button class="btn" data-act="ghconnect">Save &amp; connect</button>`}
    </div>
    ${on ? "" : `<details style="margin-top:12px"><summary class="sub" style="cursor:pointer;font-weight:800">Have a setup code from another device?</summary><div style="margin-top:8px"><textarea class="inp ghcode" id="ghCode" aria-label="Setup code" placeholder="Paste setup code (starts with LTM1:)" style="min-height:70px"></textarea><div class="actions" style="justify-content:flex-start"><button class="btn" data-act="ghusecode">Use setup code</button></div></div></details>`}
    <details style="margin-top:10px"><summary class="sub" style="cursor:pointer;font-weight:800">How to set this up</summary><div class="sub" style="display:grid;gap:6px;margin-top:6px">
      <p style="margin:0"><b style="color:var(--txt)">1.</b> On github.com, create a <b>private</b> repository (for example <code>ltm-data</code>) and tick “Add a README”.</p>
      <p style="margin:0"><b style="color:var(--txt)">2.</b> Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate. Choose <b>Only select repositories</b> and pick just that repository. Under Repository permissions set <b>Contents</b> to <b>Read and write</b>.</p>
      <p style="margin:0"><b style="color:var(--txt)">3.</b> Copy the token (it starts with <code>github_pat_</code> and is shown once), paste it above and press Save &amp; connect.</p>
      <p style="margin:0"><b style="color:var(--txt)">4.</b> On your other device, open this app, then use “Copy setup code” here and paste it there. Treat the code like a password: it contains the token.</p></div></details>
  </section>`;
}
function gotoSection(id) {
  closeDrawer(); closeModal();
  if (currentView() !== "settings") location.hash = "#settings";
  setTimeout(() => { const el = q("#" + id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 90);
}
document.addEventListener("visibilitychange", () => {
  if (!GH.cfg) return;
  if (document.visibilityState === "visible") { if (Date.now() - GH.last > 20000) ghSync("visible"); }
  else if (ghDirty()) ghSync("hidden");
});
window.addEventListener("online", () => { if (GH.cfg) ghSync("online"); });

/* =================================================================
   BOOT
   ================================================================= */
ghLoad(); load(); compute(); render();
if (firstRun) {
  save();
  openModal("Welcome to V" + APP.version, `<p>This copy starts from your built-in history and the settings we agreed on.</p><p class="sub">Already use LTM on another device or browser? Connect Device sync (GitHub) to load your data, or paste a State you copied.</p><div class="actions"><button class="btn quiet" id="wSkip">Start fresh</button><button class="btn quiet" id="wPaste">Paste State</button><button class="btn" id="wSync">Connect GitHub</button></div>`, b => {
    b.querySelector("#wSkip").onclick = closeModal;
    b.querySelector("#wPaste").onclick = () => { closeModal(); location.hash = "#settings"; setTimeout(() => { const el = q("#stateIn"); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } }, 90); };
    b.querySelector("#wSync").onclick = () => gotoSection("devsync");
  });
}
if (GH.cfg) ghSync("boot");
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
</body>
</html>
